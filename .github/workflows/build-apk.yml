name: Compilar APK da Suzuki

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Java (necessário pro Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK (versão debug, pronta pra instalar)
        run: gradle assembleDebug --no-daemon

      - name: Disponibilizar o APK pra download
        uses: actions/upload-artifact@v4
        with:
          name: suzuki-mobile-apk
          path: app/build/outputs/apk/debug/app-debug.apk
